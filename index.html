<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso DAR Miranda</title>

    <!-- Estilos del login -->
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="cover-page">

    <!-- Capa oscura -->
    <div class="overlay"></div>

    <!-- Contenedor principal -->
    <div class="welcome-container">
        <div class="login-card">

            <!-- HEADER -->
            <div class="login-header">
                <div class="logo-container">
                    <img src="img/Logo.png" alt="Logo DAR Miranda" class="login-logo">
                </div>
                <h1>Sistema de Gestión</h1>
                <p class="subtitle">DAR Miranda</p>
            </div>

            <!-- LOGIN -->
            <div id="vista-login" style="display: block;">
                <div class="form-group-login">

                    <label>USUARIO</label>
                    <input type="text" id="u_usuario" placeholder="usuario">

                    <label>CONTRASEÑA</label>
                    <div class="password-wrapper">
                        <input type="password" id="u_clave" placeholder="••••••••">
                        <i class="fas fa-eye" id="togglePassword"></i>
                    </div>

                    <button type="button" onclick="entrar()" class="btn-login">
                        Iniciar Sesión
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer-dem">
        Dirección Ejecutiva de la Magistratura
    </footer>

    <!-- Imagen decorativa -->
    <div class="dama-justicia-bg"></div>

    <!-- AUTH -->
    <script src="js/auth/auth.js"></script>
</body>
</html>
